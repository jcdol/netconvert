<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Calculateurs gratuits pour l'administration systèmes, réseaux, cloud et cybersécurité : IPv4/CIDR, VLSM, IPv6, chmod, RAID, CVSS… 100 % local.">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NetConvert">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>NetConvert — Calculateurs Admin Sys, Réseau, Cloud & Cyber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* thème sombre uniquement */
:root{color-scheme:dark;
  --bg:#0b0f14;--panel:#11161d;--panel2:#171e27;--line:#222b36;--line2:#2c3744;--txt:#e3e9ef;--mut:#8a96a3;
  --acc:#4cc38a;--acc2:#6ea8fe;--warn:#e0b24d;--err:#f2706a;--net:#6ea8fe;--sys:#4cc38a;--cloud:#b392f0;--cyber:#f0a35e;--learn:#f2c94c;
  --on-acc:#06130c;--hl:rgba(76,195,138,.10);--shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;--r:12px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc2)}
::selection{background:var(--acc2);color:#fff}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
main{min-width:0}body{overflow-x:hidden}.help code{word-break:break-word}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
aside::-webkit-scrollbar,.tbl::-webkit-scrollbar{width:8px;height:8px}aside::-webkit-scrollbar-thumb,.tbl::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.brand{display:flex;align-items:center;gap:11px;margin:0 6px 18px;text-decoration:none;color:var(--txt)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--net),var(--sys));display:grid;place-items:center;font:700 14px var(--mono);color:#fff;flex:none}
.brand b{font-size:16.5px;display:block;letter-spacing:-.01em}.brand small{color:var(--mut);font-size:12px}
.sbox{position:relative;margin-bottom:6px}
#search{padding:9px 34px 9px 12px;font:14px Inter,sans-serif;background:var(--bg)}
.sbox kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--mut);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.cat{font:600 11px Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:18px 10px 6px;display:flex;align-items:center;gap:8px}
.cat i{width:7px;height:7px;border-radius:50%;display:inline-block}
nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:var(--txt);text-decoration:none;font-size:14px;opacity:.86;transition:background .15s,opacity .15s}
nav a:hover{background:var(--panel2);opacity:1}
nav a.on{background:var(--panel2);opacity:1;font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
nav a.star::after{content:'★';margin-left:auto;color:var(--learn);font-size:11px}
nav a.special{font-weight:600;opacity:1}
.side-foot{margin-top:auto;padding-top:16px;display:flex;gap:8px}
.side-foot button{flex:1;font-size:13px;padding:8px}
main{padding:32px clamp(18px,4vw,56px) 80px;max-width:1120px;width:100%}
.tool{display:none}.tool.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tool h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tool .desc{color:var(--mut);margin:0 0 22px;max-width:760px}
.tag{font:600 11px var(--mono);padding:2px 9px;border-radius:20px;border:1px solid;vertical-align:middle}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:13px;margin:0 0 14px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.f label{font-size:12.5px;color:var(--mut);font-weight:500}
input,select,textarea{background:var(--bg);color:var(--txt);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font:14px var(--mono);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 22%,transparent)}
textarea{min-height:130px;resize:vertical;line-height:1.5}
input.bad{border-color:var(--err)}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:9px;padding:9px 15px;font:500 14px Inter,sans-serif;cursor:pointer;transition:border-color .15s,transform .05s,background .15s}
button:hover{border-color:var(--acc2)}button:active{transform:translateY(1px)}
button.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:600}
button.pri:hover{filter:brightness(1.07)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{padding:4px 11px;font:12px var(--mono);border-radius:20px}
.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 16px;align-items:center}
.kv>span{color:var(--mut);font-size:13px}
code.v{font:14px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;word-break:break-all;display:block;transition:border-color .15s}
code.v:hover{border-color:var(--acc)}
code{font-family:var(--mono)}
.err{color:var(--err);font-size:13px;margin-top:8px}
.note{color:var(--mut);font-size:13px;margin-top:12px}
table{width:100%;border-collapse:collapse;font:13px var(--mono)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font:600 12px Inter,sans-serif;position:sticky;top:0;background:var(--panel)}
tr.hl td{background:var(--hl)}
.tbl{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.bits{font:13px var(--mono);line-height:1.9;word-break:break-all}
.bits .n{color:var(--net)}.bits .h{color:var(--sys)}
.perm{display:grid;grid-template-columns:110px repeat(3,70px);gap:6px;align-items:center;font-size:14px}
.perm input{width:18px;height:18px;accent-color:var(--acc)}
.perm .hd{color:var(--mut);font-size:12px;text-align:center}
.perm .c{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.home a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;text-decoration:none;color:var(--txt);transition:border-color .15s,transform .15s}
.home a:hover{border-color:var(--line2);transform:translateY(-2px)}
.home a b{display:block;margin-bottom:4px;font-size:14.5px}.home a small{color:var(--mut);display:block;line-height:1.45;font-size:13px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--txt);color:var(--bg);font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;transition:.22s;z-index:30;box-shadow:var(--shadow)}
#toast.show{transform:translateX(-50%)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:8px}
.stat{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--txt);position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.stat:hover{transform:translateY(-2px);border-color:var(--line2)}.stat .ic{font-size:22px}.stat small{color:var(--mut);font-size:13px;line-height:1.45}.stat em{font-style:normal;color:var(--c);font-size:13px;margin-top:8px;font-weight:600}
h2.sec{font-size:17px;margin:34px 0 14px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}h2.sec i{width:8px;height:8px;border-radius:50%}h2.sec small{color:var(--mut);font-weight:400;font-size:13px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.steps>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.steps span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel2);color:var(--acc);font-weight:700;margin-bottom:8px;border:1px solid var(--line2)}.steps b{display:block}.steps small{color:var(--mut)}
.help{background:color-mix(in srgb,var(--c) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));border-radius:var(--r);padding:13px 16px;margin-bottom:16px;display:grid;gap:6px;font-size:14px}
.help code{font:13px var(--mono);color:var(--c)}
.crumb{font-size:13px;color:var(--mut);margin-bottom:8px}.crumb a{color:var(--mut);text-decoration:none}.crumb a:hover{color:var(--txt)}
.hero{margin:6px 0 26px}.hero h1{font-size:clamp(26px,3.4vw,36px);line-height:1.2;letter-spacing:-.025em;max-width:820px}
.pill{display:inline-flex;gap:8px;align-items:center;font:600 12px Inter,sans-serif;color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);padding:4px 11px;border-radius:20px;margin-bottom:14px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.cta a{text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line2);color:var(--txt);background:var(--panel)}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.fav{background:none;border:1px solid var(--line2);border-radius:20px;padding:3px 11px;font-size:13px;color:var(--mut)}
.fav.on{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 45%,transparent)}

.hero{margin:10px 0 24px;padding:30px 30px 26px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(1200px 300px at 0% 0%,rgba(110,168,254,.10),transparent 60%),radial-gradient(900px 300px at 100% 100%,rgba(76,195,138,.08),transparent 60%),var(--panel)}
.hero h1{font-size:clamp(24px,3vw,34px);line-height:1.2;letter-spacing:-.025em;margin:0 0 8px;max-width:820px}
.grad{background:linear-gradient(90deg,var(--net),var(--sys) 45%,var(--cloud) 75%,var(--cyber));-webkit-background-clip:text;background-clip:text;color:transparent}
.hsearch{position:relative;margin-top:20px;max-width:640px}
.hsearch span{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:19px}
.hsearch input{padding:14px 44px;font:15px Inter,sans-serif;border-radius:12px;background:var(--bg)}
.hsearch kbd{position:absolute;right:13px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--mut);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.tcard{position:relative;padding-left:16px!important}
.tcard .dot{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
h2.sec small{margin-left:4px}
.thead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:6px}
.thead .fav{flex:none;margin-top:30px}
.crumb span{margin:0 6px}
.sibs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:13px}
.sibs>span{color:var(--mut);margin-right:4px}
.sibs a{color:var(--txt);text-decoration:none;border:1px solid var(--line2);border-radius:20px;padding:4px 11px;opacity:.85}
.sibs a:hover{border-color:var(--acc2);opacity:1}
.kvcopy{display:block;margin:0 0 10px auto;padding:4px 10px;font-size:12px;border-radius:7px;color:var(--mut);background:transparent}
.kvcopy:hover{color:var(--txt)}
.side-foot{margin-top:auto;padding:16px 10px 0;font-size:12px;color:var(--mut)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(min-width:1500px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){.cats{grid-template-columns:1fr}}
.ccard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;text-decoration:none;color:var(--txt);position:relative;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.ccard::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.ccard::after{content:'';position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 18%,transparent),transparent 70%);pointer-events:none}
.ccard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 12px 32px rgba(0,0,0,.35)}
.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cic{font-size:26px;width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,var(--panel2));border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.ccount{font:600 12px var(--mono);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);padding:3px 10px;border-radius:20px}
.ccard h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.ccard p{color:var(--mut);font-size:13.5px;margin:0 0 14px;line-height:1.45}
.ccard ul{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:6px;font-size:13.5px}
.ccard li{padding-left:14px;position:relative;opacity:.88}.ccard li::before{content:'';position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--c)}
.ccard li.more{color:var(--mut);opacity:1}.ccard li.more::before{display:none}
.cgo{margin-top:auto;font-weight:600;font-size:14px;color:var(--c)}
a.cat{text-decoration:none;border-radius:6px;padding:3px 0}a.cat:hover{color:var(--txt)}nav a.cat.on{color:var(--txt);background:none;box-shadow:none;font-weight:600}
.side-foot{flex-direction:column;gap:4px!important}.jdm{cursor:default;user-select:none;-webkit-user-select:none;opacity:.55;font:11px var(--mono);width:max-content}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,10,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.mbox{width:min(380px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.mhead button{border:0;background:none;color:var(--mut);padding:4px 8px}
#jdmCode{font:20px var(--mono);letter-spacing:.35em;text-align:center}
.shake{animation:shake .35s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.banner{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:12px;margin-bottom:20px;font-size:14px;border:1px solid}
.banner span{flex:1}.banner button{border:0;background:none;color:inherit;opacity:.7;padding:2px 6px}
.banner.info{background:color-mix(in srgb,var(--net) 10%,transparent);border-color:color-mix(in srgb,var(--net) 35%,transparent);color:var(--net)}
.banner.ok{background:color-mix(in srgb,var(--sys) 10%,transparent);border-color:color-mix(in srgb,var(--sys) 35%,transparent);color:var(--sys)}
.banner.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn)}
.admtools{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.chk{display:flex;gap:9px;align-items:center;font-size:14px;padding:4px 0;cursor:pointer}.chk input{width:16px;height:16px;accent-color:var(--acc)}
nav a.admlink{color:var(--warn);opacity:1}
#lockScreen{display:none}
body.locked .app,body.locked .banner{display:none}
body.locked #lockScreen{display:grid;place-items:center;position:fixed;inset:0;z-index:40;padding:24px;background:radial-gradient(900px 400px at 50% 0%,rgba(110,168,254,.10),transparent 70%),var(--bg)}
.lbox{max-width:480px;text-align:center}.lbox h1{font-size:28px;margin:0 0 12px;letter-spacing:-.02em}
.lbox p{color:var(--mut);font-size:15.5px;line-height:1.6;margin:16px 0 0;white-space:pre-line}
.lpill{display:inline-block;font-weight:600;font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);padding:4px 12px;border-radius:20px}
.lfoot{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);opacity:.35!important}
body.preview #lockScreen::after{content:'Aperçu — clique n\'importe où pour revenir';position:fixed;top:14px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--mut);border:1px dashed var(--line2);padding:4px 12px;border-radius:20px}
.lstate{font-weight:600;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid}
.lstate.on{color:var(--sys);background:color-mix(in srgb,var(--sys) 9%,transparent);border-color:color-mix(in srgb,var(--sys) 30%,transparent)}
.lstate.off{color:var(--err);background:color-mix(in srgb,var(--err) 9%,transparent);border-color:color-mix(in srgb,var(--err) 30%,transparent)}
button.danger{background:color-mix(in srgb,var(--err) 14%,var(--panel2));border-color:color-mix(in srgb,var(--err) 45%,transparent);color:var(--err);font-weight:600}
.fjdm{display:block;margin:8px auto 0;opacity:.6}
body.booting .app{visibility:hidden}
.instbtn{display:none}
body.can-install .instbtn{display:inline-flex;align-items:center;gap:6px}
.side-foot .instbtn{width:100%;justify-content:center;margin-bottom:8px;font-size:13px}
.hinst{margin-top:18px}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:center}
.menu-btn{display:none}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .perm{grid-template-columns:82px repeat(3,minmax(0,1fr));font-size:13px}.perm label{font-size:12px}
  .tool h1{font-size:22px}
  aside{position:sticky;top:0;z-index:20;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px}
  .brand{margin:0}
  .menu-btn{display:block;position:absolute;right:14px;top:12px}
  aside .sbox,aside nav,aside .side-foot{display:none}
  aside.open{max-height:100vh;overflow:auto}
  aside.open .sbox,aside.open nav,aside.open .side-foot{display:block}aside.open .side-foot{display:flex}
  aside.open .sbox{margin-top:14px}
  .grid2{grid-template-columns:1fr}
  .hero{padding:24px 18px}.thead{flex-direction:column}.thead .fav{margin-top:0}
  .kv{grid-template-columns:1fr}
  main{padding-top:22px}
}
</style>
</head>
<body class="booting">
<div class="app">
<aside id="side">
  <a class="brand" href="#accueil"><div class="logo">&gt;_</div><div><b>NetConvert</b><small>Sys · Réseau · Cloud · Cyber</small></div></a>
  <button class="menu-btn" id="menuBtn" aria-label="Menu">☰ Menu</button>
  <div class="sbox"><input id="search" placeholder="Rechercher un outil…" autocomplete="off"><kbd>/</kbd></div>
  <nav id="nav"></nav>
  <div class="side-foot"><button class="instbtn" type="button">⬇ Installer l'application</button><span>100 % local · aucune donnée envoyée</span></div>
</aside>
<main id="main"></main>
</div>
<div id="toast">Copié</div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kv=rows=>'<button class="kvcopy" title="Copier tous les résultats">⧉ Tout copier</button><div class="kv">'+rows.map(([k,v])=>`<span>${esc(k)}</span><code class="v" title="Cliquer pour copier">${esc(v)}</code>`).join('')+'</div>';
const fmtN=(n,d=2)=>Number(n).toLocaleString('fr-FR',{maximumFractionDigits:d});
function fmtDur(s){
  if(!isFinite(s))return '—';
  if(s<1)return fmtN(s*1000,1)+' ms';
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
  const p=[];if(d)p.push(d+' j');if(h)p.push(h+' h');if(m)p.push(m+' min');
  if(sec>=0.05||!p.length)p.push((d||h?Math.round(sec):fmtN(sec,1))+' s');
  return p.join(' ');
}

/* ---------- IPv4 helpers ---------- */
function ipToInt(s){const p=String(s).trim().split('.');if(p.length!==4)return null;let n=0;for(const x of p){if(!/^\d{1,3}$/.test(x))return null;const v=+x;if(v>255)return null;n=n*256+v}return n}
const intToIp=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const pfxToMask=p=>p===0?0:(0xFFFFFFFF<<(32-p))>>>0;
function maskToPfx(m){const inv=(~m)>>>0;if((inv&(inv+1))!==0)return null;let c=0;for(let i=0;i<32;i++)if((m>>>i)&1)c++;return c}
const bin32=n=>(n>>>0).toString(2).padStart(32,'0');
const binDotted=n=>bin32(n).match(/.{8}/g).join('.');
function parseMask(s){
  s=String(s).trim().replace(/^\//,'');
  if(/^\d{1,2}$/.test(s)){const p=+s;return p<=32?p:null}
  const m=ipToInt(s);if(m===null)return null;
  let p=maskToPfx(m);if(p!==null)return p;
  p=maskToPfx((~m)>>>0);return p; // wildcard accepté
}
function ipType(n){
  const a=n>>>24,b=(n>>>16)&255;
  if(a===10||(a===172&&b>=16&&b<=31)||(a===192&&b===168))return 'Privée (RFC 1918)';
  if(a===127)return 'Loopback';
  if(a===169&&b===254)return 'APIPA / lien local (RFC 3927)';
  if(a===100&&b>=64&&b<=127)return 'CGNAT partagée (RFC 6598)';
  if(a>=224&&a<=239)return 'Multicast';
  if(a>=240)return n===0xFFFFFFFF?'Broadcast limité':'Réservée (classe E)';
  if(a===0)return 'Réseau « ce réseau » (0.0.0.0/8)';
  return 'Publique';
}
const ipClass=n=>{const a=n>>>24;return a<128?'A':a<192?'B':a<224?'C':a<240?'D (multicast)':'E (réservée)'};

const CATS={net:['Réseau','var(--net)','Adressage IPv4/IPv6, masques, MAC, ports, Wi-Fi','🌐'],sys:['Systèmes','var(--sys)','Linux, permissions, stockage, RAID, planification','🖥️'],cloud:['Cloud & données','var(--cloud)','Débits, SLA, YAML, encodages, empreintes','☁️'],cyber:['Cybersécurité','var(--cyber)','Mots de passe, CVSS, en-têtes HTTP, signatures','🛡️']};

    $('#v4sub').innerHTML=rows;

tool({id:'vlsm',cat:'net',name:'Plan d\'adressage VLSM',desc:'Découpe un réseau en sous-réseaux de tailles différentes selon le nombre de machines de chaque service. Le plan est prêt à copier.',

init(){let plan=[];const run=()=>{
  const [ipS,pS]=$('#vlnet').value.trim().split('/');const ip=ipToInt(ipS),p=parseMask(pS||'');
  if(ip===null||p===null){$('#vlerr').textContent='Réseau invalide (ex. 10.0.0.0/16).';return}
  const mask=pfxToMask(p),net=(ip&mask)>>>0,end=net+2**(32-p);
  const req=$('#vlreq').value.split('\n').map((l,i)=>{const m=l.trim().match(/^(.*?)[\s:=;,]*\s(\d+)$|^(\d+)$/);if(!m)return null;return {name:(m[1]||'').replace(/[\s:=;,-]+$/,'')||'Sous-réseau '+(i+1),h:+(m[2]||m[3])}}).filter(x=>x&&x.h>0);
  if(!req.length){$('#vlerr').textContent='Ajoute au moins une ligne « Nom : hôtes ».';return}
  $('#vlerr').textContent=(net!==ip?`Note : ${intToIp(ip)} a été ramené à l'adresse réseau ${intToIp(net)}. `:'');
  const sorted=[...req].sort((a,b)=>b.h-a.h);let cur=net;plan=[];const steps=[];let used=0;
  for(const r of sorted){const need=r.h+2,bits=Math.max(2,Math.ceil(Math.log2(need))),size=2**bits,np=32-bits;
    cur=Math.ceil((cur-net)/size)*size+net;const fits=np>=p&&cur+size<=end;
    plan.push({...r,np,size,start:cur,fits});steps.push(`<b>${esc(r.name)}</b> : ${r.h} hôtes + 2 (réseau et broadcast) = ${need} → puissance de 2 supérieure : ${size} = 2<sup>${bits}</sup> → <code>/${np}</code>${fits?` → placé en <code>${intToIp(cur)}/${np}</code>`:' → <span style="color:var(--err)">ne rentre pas</span>'}`);
    if(fits){cur+=size;used+=size}}
  let rows='<tr><th>Nom</th><th>Demandés</th><th>Dispo</th><th>Réseau</th><th>Masque</th><th>Plage utilisable</th><th>Broadcast</th><th>Usage</th></tr>';
  for(const x of plan){if(!x.fits){rows+=`<tr><td>${esc(x.name)}</td><td>${x.h}</td><td colspan="6" style="color:var(--err)">Ne rentre pas dans ${intToIp(net)}/${p} — agrandis le réseau de départ</td></tr>`;continue}
    const e=x.start+x.size-1,pct=Math.round(x.h/(x.size-2)*100);
    rows+=`<tr><td style="font-family:Inter">${esc(x.name)}</td><td>${x.h}</td><td>${x.size-2}</td><td>${intToIp(x.start)}/${x.np}</td><td>${intToIp(pfxToMask(x.np))}</td><td>${intToIp(x.start+1)} – ${intToIp(e-1)}</td><td>${intToIp(e)}</td><td><span style="color:${pct>=70?'var(--acc)':pct>=40?'var(--warn)':'var(--mut)'}">${pct} %</span></td></tr>`}
  $('#vltbl').innerHTML=rows;const total=2**(32-p),ok=plan.every(x=>x.fits);
  $('#vlsum').innerHTML=kv([['Réseau de départ',`${intToIp(net)}/${p} (${fmtN(total,0)} adresses)`],['Adresses attribuées',`${fmtN(used,0)} (${fmtN(used/total*100,1)} %)`],['Espace libre restant',used<total?`${intToIp(cur)} → ${intToIp(end-1)} (${fmtN(end-cur,0)} adresses)`:'aucun'],['Résultat',ok?'✔ Tous les sous-réseaux tiennent':'✘ Certains sous-réseaux ne tiennent pas']]);};
  ['#vlnet','#vlreq'].forEach(s=>$(s).addEventListener('input',run));
  $('#vlcopy').onclick=async()=>{const t=['Nom\tHôtes demandés\tHôtes dispo\tRéseau\tMasque\tPremière IP\tDernière IP\tBroadcast',...plan.filter(x=>x.fits).map(x=>{const e=x.start+x.size-1;return [x.name,x.h,x.size-2,intToIp(x.start)+'/'+x.np,intToIp(pfxToMask(x.np)),intToIp(x.start+1),intToIp(e-1),intToIp(e)].join('\t')})].join('\n');
    try{await navigator.clipboard.writeText(t);toast('Plan copié : colle-le dans Excel ou Sheets')}catch{toast('Copie refusée par le navigateur')}};run();}});

/* IPv6 */
function parseV6(s){
  s=String(s).trim().toLowerCase();let pfx=null;
  if(s.includes('/')){const k=s.split('/');s=k[0];if(!/^\d{1,3}$/.test(k[1]))return null;pfx=+k[1];if(pfx>128)return null}
  const m=s.match(/(\d+\.\d+\.\d+\.\d+)$/);
  if(m){const n=ipToInt(m[1]);if(n===null)return null;s=s.slice(0,-m[1].length)+(n>>>16).toString(16)+':'+(n&0xffff).toString(16)}
  const d=s.split('::');if(d.length>2)return null;
  const head=d[0]?d[0].split(':'):[],tail=d.length===2&&d[1]?d[1].split(':'):[];
  let fill=0;if(d.length===2){fill=8-head.length-tail.length;if(fill<1)return null}else if(head.length!==8)return null;
  const g=[...head,...Array(fill).fill('0'),...tail];
  if(g.length!==8||!g.every(x=>/^[0-9a-f]{1,4}$/.test(x)))return null;
  return {g:g.map(x=>parseInt(x,16)),pfx};
}
function v6compress(g){
  let bs=-1,bl=0;for(let i=0;i<8;){if(g[i]===0){let j=i;while(j<8&&g[j]===0)j++;if(j-i>bl&&j-i>=2){bs=i;bl=j-i}i=j}else i++}
  const h=g.map(x=>x.toString(16));if(bs<0)return h.join(':');
  return h.slice(0,bs).join(':')+'::'+h.slice(bs+bl).join(':');
}
const v6expand=g=>g.map(x=>x.toString(16).padStart(4,'0')).join(':');
const g2big=g=>g.reduce((a,x)=>(a<<16n)|BigInt(x),0n);
const big2g=b=>{const g=[];for(let i=7;i>=0;i--)g.push(Number((b>>BigInt(i*16))&0xffffn));return g};
function v6type(g){const a=g[0];
  if(g.every(x=>x===0))return 'Non spécifiée (::)';
  if(g.slice(0,7).every(x=>x===0)&&g[7]===1)return 'Loopback (::1)';
  if(g.slice(0,5).every(x=>x===0)&&g[5]===0xffff)return 'IPv4 mappée (::ffff:0:0/96)';
  if((a&0xffc0)===0xfe80)return 'Lien local (fe80::/10)';
  if((a&0xfe00)===0xfc00)return 'Unique locale ULA (fc00::/7) — équivalent du privé';
  if((a&0xff00)===0xff00)return 'Multicast (ff00::/8)';
  if(a===0x2001&&g[1]===0x0db8)return 'Documentation (2001:db8::/32)';
  if((a&0xe000)===0x2000)return 'Unicast global (2000::/3)';
  return 'Réservée / autre';}
function macBytes(s){const h=String(s).replace(/[^0-9a-f]/gi,'');if(h.length!==12)return null;return h.match(/../g).map(x=>parseInt(x,16))}
tool({id:'ipv6',cat:'net',name:'IPv6 : compresser / étendre',desc:'Forme compressée (RFC 5952), forme complète, préfixe, plage, type d\'adresse, DNS inverse, et génération EUI-64 depuis une MAC.',

init(){
  const sym=(o)=>{const sp=o>>9,s='rwxrwxrwx'.split('').map((c,i)=>(o>>(8-i))&1?c:'-');
    if(sp&4)s[2]=s[2]==='x'?'s':'S';if(sp&2)s[5]=s[5]==='x'?'s':'S';if(sp&1)s[8]=s[8]==='x'?'t':'T';return s.join('')};
  const fromSym=s=>{s=s.trim();if(s.length===10)s=s.slice(1);if(!/^[r-][w-][xsS-][r-][w-][xsS-][r-][w-][xtT-]$/.test(s))return null;
    let o=0;for(let i=0;i<9;i++){const c=s[i];if(c!=='-'&&c!=='S'&&c!=='T')o|=1<<(8-i)}
    if(/[sS]/.test(s[2]))o|=4<<9;if(/[sS]/.test(s[5]))o|=2<<9;if(/[tT]/.test(s[8]))o|=1<<9;return o};
  const show=(o,src)=>{if(src!=='o')$('#cho').value=(o>>9?String(o>>9):'')+((o&511).toString(8).padStart(3,'0'));
    if(src!=='s')$('#chs').value=sym(o);
    $$('[data-w]').forEach(c=>c.checked=!!(((o>>(3*(2-c.dataset.w)))&7)&c.dataset.v));
    $$('[data-sp]').forEach(c=>c.checked=!!((o>>9)&c.dataset.sp));
    const oc=$('#cho').value;
    const cl=t=>t.replace(/-/g,'').replace(/[sStT]/g,m=>({s:'xs',S:'s',t:'xt',T:'t'}[m]));const sy=sym(o);
    $('#chout').innerHTML=kv([['Commande octale',`chmod ${oc} fichier`],['Commande symbolique',`chmod u=${cl(sy.slice(0,3))},g=${cl(sy.slice(3,6))},o=${cl(sy.slice(6))} fichier`],['Affichage ls -l','-'+sy]]);};
  $('#cho').oninput=e=>{const v=e.target.value.trim();e.target.classList.toggle('bad',!/^[0-7]{3,4}$/.test(v));if(/^[0-7]{3,4}$/.test(v))show(parseInt(v,8),'o')};
  $('#chs').oninput=e=>{const o=fromSym(e.target.value);e.target.classList.toggle('bad',o===null);if(o!==null)show(o,'s')};
  $$('[data-w],[data-sp]').forEach(c=>c.onchange=()=>{let o=0;$$('[data-w]').forEach(x=>{if(x.checked)o|=x.dataset.v<<(3*(2-x.dataset.w))});$$('[data-sp]').forEach(x=>{if(x.checked)o|=x.dataset.sp<<9});show(o)});
  const um=()=>{const v=$('#umin').value.trim();if(!/^[0-7]{3,4}$/.test(v)){$('#umout').innerHTML='<div class="err">umask invalide</div>';return}
    const u=parseInt(v,8)&511,f=0o666&~u,d=0o777&~u;
    $('#umout').innerHTML=kv([['Fichiers (666 − umask)',f.toString(8).padStart(3,'0')+'  '+sym(f)],['Dossiers (777 − umask)',d.toString(8).padStart(3,'0')+'  '+sym(d)]]);};
  $('#umin').oninput=um;show(0o755);um();}});

/* cron */
const DOWN=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],MON=['','janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MACROS={'@yearly':'0 0 1 1 *','@annually':'0 0 1 1 *','@monthly':'0 0 1 * *','@weekly':'0 0 * * 0','@daily':'0 0 * * *','@midnight':'0 0 * * *','@hourly':'0 * * * *'};
function cronField(str,min,max,names){
  const set=new Set();
  for(let part of str.toLowerCase().split(',')){
    if(names)names.forEach((n,i)=>{if(n)part=part.replace(new RegExp(n.slice(0,3),'g'),String(i))});
    const m=part.match(/^(\*|\d+(?:-\d+)?)(?:\/(\d+))?$/);if(!m)return null;
    let a,b;if(m[1]==='*'){a=min;b=max}else if(m[1].includes('-')){[a,b]=m[1].split('-').map(Number)}else{a=b=+m[1];if(m[2])b=max}
    const st=m[2]?+m[2]:1;if(a<min||b>max||a>b||st<1)return null;
    for(let i=a;i<=b;i+=st)set.add(i);
  }return set}
tool({id:'cron',cat:'sys',name:'Expression cron',desc:'Traduit une ligne crontab en français et calcule les prochaines exécutions.',
html:`<div class="card"><div class="f"><label>Expression (minute heure jour-du-mois mois jour-de-la-semaine)</label><input id="crin" value="*/15 8-18 * * 1-5"></div>

<div id="crout" style="margin-top:14px"></div></div>`,
init(){const run=()=>{let s=$('#crin').value.trim();s=MACROS[s.toLowerCase()]||s;const p=s.split(/\s+/);
  if(p.length!==5){$('#crout').innerHTML='<div class="err">Il faut 5 champs (ou une macro @daily, @hourly…).</div>';return}
  const dowN=['sun','mon','tue','wed','thu','fri','sat'];
  const f=[cronField(p[0],0,59),cronField(p[1],0,23),cronField(p[2],1,31),cronField(p[3],1,12,['','jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']),cronField(p[4].replace(/\b7\b/g,'0'),0,6,dowN)];
  if(f.some(x=>!x)){$('#crout').innerHTML='<div class="err">Champ invalide.</div>';return}
  const desc=(set,all,fmt)=>set.size===all?'tous':[...set].map(fmt).join(', ');
  const domR=p[2]!=='*',dowR=p[4]!=='*';
  const out=[['Minutes',desc(f[0],60,String)],['Heures',desc(f[1],24,h=>h+' h')],['Jours du mois',desc(f[2],31,String)],['Mois',desc(f[3],12,m=>MON[m])],['Jours de la semaine',desc(f[4],7,d=>DOWN[d])]];
  const next=[];let d=new Date();d.setSeconds(0,0);d.setMinutes(d.getMinutes()+1);let guard=0;
  while(next.length<6&&guard++<600000){
    if(!f[3].has(d.getMonth()+1)){d.setMonth(d.getMonth()+1,1);d.setHours(0,0);continue}
    const dm=f[2].has(d.getDate()),dw=f[4].has(d.getDay());const dayOk=domR&&dowR?(dm||dw):(dm&&dw);
    if(!dayOk){d.setDate(d.getDate()+1);d.setHours(0,0);continue}
    if(!f[1].has(d.getHours())){d.setHours(d.getHours()+1,0);continue}
    if(f[0].has(d.getMinutes()))next.push(new Date(d));d.setMinutes(d.getMinutes()+1);}
  out.push(['Prochaines exécutions',next.map(x=>x.toLocaleString('fr-FR',{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})).join('  ·  ')||'aucune dans les prochaines années'],['Ligne crontab',s+'  /chemin/script.sh']);
  $('#crout').innerHTML=kv(out)+(domR&&dowR?'<div class="note">Jour du mois ET jour de semaine renseignés : cron exécute si l\'un OU l\'autre correspond.</div>':'');};
  $('#crin').addEventListener('input',run);$$('[data-c]').forEach(b=>b.onclick=()=>{$('#crin').value=b.dataset.c;run()});run();}});

/* bandwidth */
const BW=[['bit/s',1],['Kbit/s',1e3],['Mbit/s',1e6],['Gbit/s',1e9],['Ko/s',8e3],['Mo/s',8e6],['Go/s',8e9]];
const SZ=[['Mo',1e6],['Go',1e9],['To',1e12],['Mio',2**20],['Gio',2**30],['Tio',2**40]];
tool({id:'debit',cat:'cloud',name:'Débit & temps de transfert',desc:'Mbit/s ↔ Mo/s, et durée d\'un transfert, d\'une sauvegarde ou d\'une migration vers le cloud.',

<div class="f"><label>Débit</label><input id="trb" type="number" step="any" value="100"></div><div class="f"><label>Unité</label><select id="trbu">${BW.map(([n],i)=>`<option value="${i}" ${i===2?'selected':''}>${n}</option>`).join('')}</select></div>

  const tr=()=>{const bytes=(+$('#trs').value||0)*SZ[+$('#tru').value][1],bps=(+$('#trb').value||0)*BW[+$('#trbu').value][1]*((+$('#tre').value||100)/100);
    const t=bytes*8/bps;$('#trout').innerHTML=kv([['Durée estimée',fmtDur(t)],['Débit utile',fmtN(bps/8e6,2)+' Mo/s'],['Volume par jour à ce débit',fmtN(bps/8*86400/1e12,2)+' To/jour']]);};
  ['#bwv','#bwu'].forEach(s=>$(s).addEventListener('input',bw));['#trs','#tru','#trb','#trbu','#tre'].forEach(s=>$(s).addEventListener('input',tr));bw();tr();}});

/* SLA */
tool({id:'sla',cat:'cloud',name:'SLA & disponibilité',desc:'Pourcentage de disponibilité (les « neuf ») ↔ temps d\'indisponibilité autorisé par jour, mois, an.',

<div class="card"><h2>Inverse : indisponibilité constatée → disponibilité</h2><div class="row"><div class="f"><label>Panne (minutes)</label><input id="sld" type="number" step="any" value="45"></div><div class="f"><label>Sur la période</label><select id="slp"><option value="86400">1 jour</option><option value="604800">1 semaine</option><option value="2629746" selected>1 mois</option><option value="31556952">1 an</option></select></div></div><div id="slout2" style="margin-top:12px"></div></div>

  const run=()=>{const v=+$('#slv').value;if(!(v>=0&&v<=100)){$('#slout').innerHTML='<div class="err">Entre 0 et 100</div>';return}$('#slout').innerHTML=kv(P.map(([n,s])=>[n,fmtDur((1-v/100)*s)]))};

/* JSON / YAML */
function yScalar(v){if(v===null)return 'null';if(typeof v!=='string')return String(v);
  if(v===''||/^(true|false|null|yes|no|on|off|~)$/i.test(v)||/^[-+]?(\d|\.\d)/.test(v)&&!isNaN(+v)||/^[\s\-?:,\[\]{}#&*!|>'"%@`]/.test(v)||/:\s|\s#|:$/.test(v)||/\s$/.test(v)||/\n/.test(v))return JSON.stringify(v);return v}
function toYaml(v,ind=0){const pad='  '.repeat(ind);const isEmpty=x=>x&&typeof x==='object'&&(Array.isArray(x)?!x.length:!Object.keys(x).length);
  const inl=x=>isEmpty(x)?(Array.isArray(x)?'[]':'{}'):yScalar(x);const isC=x=>x&&typeof x==='object'&&!isEmpty(x);
  if(Array.isArray(v)){if(!v.length)return pad+'[]';return v.map(x=>isC(x)?pad+'- '+toYaml(x,ind+1).trimStart():pad+'- '+inl(x)).join('\n')}
  if(v&&typeof v==='object'){const k=Object.keys(v);if(!k.length)return pad+'{}';return k.map(key=>{const x=v[key],kk=pad+yScalar(key)+':';return isC(x)?kk+'\n'+toYaml(x,ind+1):kk+' '+inl(x)}).join('\n')}
  return pad+yScalar(v)}
tool({id:'json-yaml',cat:'cloud',name:'JSON → YAML · formatage',desc:'Convertis du JSON en YAML (Kubernetes, Docker Compose, Ansible, CloudFormation), valide, formate ou minifie du JSON.',
html:`<div class="card"><div class="f"><label>JSON</label><textarea id="jyin">{"apiVersion":"apps/v1","kind":"Deployment","metadata":{"name":"web","labels":{"app":"web"}},"spec":{"replicas":3,"selector":{"matchLabels":{"app":"web"}},"template":{"metadata":{"labels":{"app":"web"}},"spec":{"containers":[{"name":"nginx","image":"nginx:1.27","ports":[{"containerPort":80}]}]}}}}</textarea></div>
<div class="row" style="margin-top:10px"><button class="pri" data-j="yaml">→ YAML</button><button data-j="pretty">Formater</button><button data-j="min">Minifier</button><button id="jycopy">Copier le résultat</button></div>
<div id="jyerr" class="err"></div><div class="f" style="margin-top:12px"><label>Résultat</label><textarea id="jyout" readonly style="min-height:260px"></textarea></div></div>`,
init(){let mode='yaml';const run=()=>{let o;try{o=JSON.parse($('#jyin').value);$('#jyerr').textContent=''}catch(e){$('#jyerr').textContent='JSON invalide : '+e.message;return}
  $('#jyout').value=mode==='yaml'?toYaml(o):mode==='pretty'?JSON.stringify(o,null,2):JSON.stringify(o)};
  $$('[data-j]').forEach(b=>b.onclick=()=>{mode=b.dataset.j;run()});$('#jyin').oninput=run;
  $('#jycopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#jyout').value);toast('Copié')}catch{$('#jyout').select();toast('Sélectionné, fais Ctrl+C')}};run();}});

/* Encodages */
const utf8=s=>new TextEncoder().encode(s);
const b64e=bytes=>{let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)};
const b64d=s=>{s=s.replace(/\s/g,'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(b,c=>c.charCodeAt(0)))};
tool({id:'encodage',cat:'cloud',name:'Base64 · URL · Hex',desc:'Encode et décode en Base64 (secrets Kubernetes, en-têtes Basic Auth), Base64URL (JWT), URL et hexadécimal.',
html:`<div class="card"><div class="row"><div class="f"><label>Format</label><select id="enf"><option value="b64">Base64</option><option value="b64u">Base64URL (JWT)</option><option value="url">URL (percent-encoding)</option><option value="hex">Hexadécimal</option><option value="basic">Basic Auth (user:mdp)</option><option value="jwt">Décoder un JWT</option></select></div><div class="f"><label>Sens</label><select id="ens"><option value="e">Encoder</option><option value="d">Décoder</option></select></div></div>
<div class="f" style="margin-top:12px"><label>Entrée</label><textarea id="enin">admin:MotDePasse!2026</textarea></div><div id="enerr" class="err"></div>
<div class="f" style="margin-top:12px"><label>Sortie (cliquer pour copier)</label><code class="v" id="enout" style="min-height:44px;white-space:pre-wrap"></code></div></div>`,
init(){const run=()=>{const f=$('#enf').value,d=$('#ens').value==='d',s=$('#enin').value;let r='';$('#enerr').textContent='';$('#ens').disabled=f==='jwt';
  try{
    if(f==='b64')r=d?b64d(s):b64e(utf8(s));
    else if(f==='b64u')r=d?b64d(s):b64e(utf8(s)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    else if(f==='url')r=d?decodeURIComponent(s.replace(/\+/g,' ')):encodeURIComponent(s);
    else if(f==='hex')r=d?new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from((s.replace(/^0x|[\s:]/gi,'').match(/../g)||[]).map(x=>{const v=parseInt(x,16);if(isNaN(v))throw Error('hex');return v}))):[...utf8(s)].map(b=>b.toString(16).padStart(2,'0')).join(' ');
    else if(f==='basic')r=d?b64d(s.replace(/^Basic\s+/i,'')):'Authorization: Basic '+b64e(utf8(s));
    else if(f==='jwt'){const p=s.trim().split('.');if(p.length<2)throw Error();const h=JSON.parse(b64d(p[0])),pl=JSON.parse(b64d(p[1]));
      r='EN-TÊTE\n'+JSON.stringify(h,null,2)+'\n\nCHARGE UTILE\n'+JSON.stringify(pl,null,2);['exp','iat','nbf'].forEach(k=>{if(pl[k])r+=`\n${k} = ${new Date(pl[k]*1000).toLocaleString('fr-FR')}`});r+='\n\n(La signature n\'est pas vérifiée.)'}
  }catch(e){$('#enerr').textContent='Entrée invalide pour ce décodage.';r=''}
  $('#enout').textContent=r;};
  ['#enf','#ens','#enin'].forEach(s=>$(s).addEventListener('input',run));run();}});

/* Hash */
tool({id:'hash',cat:'cloud',name:'Empreintes (hash)',desc:'SHA-1, SHA-256, SHA-384, SHA-512 d\'un texte ou d\'un fichier, et comparaison avec une empreinte attendue (vérification d\'ISO).',
html:`<div class="card"><div class="f"><label>Texte</label><textarea id="hsin" style="min-height:90px">Bonjour NetConvert</textarea></div>
<div class="row" style="margin-top:10px"><div class="f"><label>…ou un fichier (traité localement, rien n'est envoyé)</label><input id="hsfile" type="file"></div></div>
<div class="f" style="margin-top:10px"><label>Empreinte attendue (facultatif)</label><input id="hsexp" placeholder="Colle ici le SHA-256 publié par l'éditeur"></div>
<div id="hsout" style="margin-top:14px"></div></div>`,
init(){let last=null;const algos=['SHA-1','SHA-256','SHA-384','SHA-512'];
  const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  const run=async(buf,label)=>{if(!crypto.subtle){$('#hsout').innerHTML='<div class="err">API de chiffrement indisponible dans ce contexte.</div>';return}
    const res=await Promise.all(algos.map(a=>crypto.subtle.digest(a,buf).then(hex)));last=res;
    const exp=$('#hsexp').value.trim().toLowerCase();let m='';
    if(exp){const i=res.indexOf(exp);m=i>=0?`<div class="note" style="color:var(--acc)">✔ Correspond au ${algos[i]}</div>`:'<div class="note" style="color:var(--err)">✘ Aucune empreinte ne correspond</div>'}
    $('#hsout').innerHTML=(label?`<div class="note" style="margin:0 0 10px">${esc(label)}</div>`:'')+kv(algos.map((a,i)=>[a,res[i]]))+m+'<div class="note">MD5 n\'est pas proposé : il est cassé et absent de l\'API Web Crypto.</div>';};
  let src=()=>run(utf8($('#hsin').value));
  $('#hsin').oninput=()=>{src=()=>run(utf8($('#hsin').value));src()};
  $('#hsfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#hsout').innerHTML='<div class="note">Calcul…</div>';const b=await f.arrayBuffer();src=()=>run(b,`${f.name} — ${fmtN(f.size/1e6,2)} Mo`);src()};
  $('#hsexp').oninput=()=>src();src();}});

/* ---------- Cybersécurité (défensif) ---------- */
const rnd=n=>{const a=new Uint32Array(1);const lim=Math.floor(0x100000000/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n};
function pwEntropy(p){let pool=0;if(/[a-z]/.test(p))pool+=26;if(/[A-Z]/.test(p))pool+=26;if(/\d/.test(p))pool+=10;if(/[^a-zA-Z0-9]/.test(p))pool+=33;
  let bits=p.length*Math.log2(pool||1);
  const weak=[];if(/(.)\1{2,}/.test(p)){weak.push('caractères répétés');bits*=.8}
  if(/(0123|1234|2345|3456|4567|5678|6789|abcd|bcde|qwer|azer|wxcv)/i.test(p)){weak.push('suite clavier ou numérique');bits*=.7}
  if(/(password|motdepasse|admin|azerty|qwerty|soleil|bonjour|123456|welcome|root|toor)/i.test(p)){weak.push('mot courant du dictionnaire');bits*=.5}
  if(/(19|20)\d{2}$/.test(p)){weak.push('année en fin de mot de passe')}
  return {bits,pool,weak}}
const pwLevel=b=>b<40?['Très faible','var(--err)',15]:b<60?['Faible','var(--warn)',35]:b<80?['Correct','var(--warn)',60]:b<100?['Fort','var(--acc)',82]:['Très fort','var(--acc)',100];
tool({id:'mdp',cat:'cyber',name:'Générateur de mots de passe',desc:'Mots de passe et phrases de passe aléatoires générés avec le générateur cryptographique du navigateur.',
html:`<div class="card"><div class="row"><div class="f"><label>Longueur : <b id="pglv">20</b></label><input id="pgl" type="range" min="8" max="64" value="20" style="padding:0"></div><div class="f"><label>Nombre</label><input id="pgn" type="number" min="1" max="20" value="5"></div></div>
<div class="chips" style="gap:14px">${[['pga','a-z',1],['pgA','A-Z',1],['pg9','0-9',1],['pgs','Symboles',1],['pgx','Exclure les ambigus (0 O l 1 I)',0]].map(([i,l,c])=>`<label style="font-size:14px"><input type="checkbox" id="${i}" ${c?'checked':''} style="width:auto;accent-color:var(--acc)"> ${l}</label>`).join('')}</div>
<div class="row" style="margin-top:12px"><button class="pri" id="pggo">Générer</button><button id="pgph">Phrase de passe</button></div><div id="pgout" style="margin-top:14px"></div></div>`,
init(){const W='arbre bateau cactus dauphin ecran falaise girafe hibou igloo jardin kayak lampe marteau nuage orange piano quartz renard sable tigre usine valise wagon xylophone yaourt zebre balcon citron dragon etoile fusee glacier horizon iceberg jungle koala lagune montagne nectar olivier panda requin satellite tempete univers volcan pirate serveur routeur pare-feu cable fibre antenne cle cadenas bouclier signal orbite'.split(' ');
  $('#pgl').oninput=e=>$('#pglv').textContent=e.target.value;
  const gen=()=>{let cs='';if($('#pga').checked)cs+='abcdefghijklmnopqrstuvwxyz';if($('#pgA').checked)cs+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if($('#pg9').checked)cs+='0123456789';if($('#pgs').checked)cs+='!@#$%&*+-=?_.:;';
    if($('#pgx').checked)cs=cs.replace(/[0Ol1I]/g,'');if(!cs){$('#pgout').innerHTML='<div class="err">Coche au moins un jeu de caractères.</div>';return}
    const L=+$('#pgl').value,n=Math.min(20,Math.max(1,+$('#pgn').value||1));const list=[];for(let k=0;k<n;k++){let s='';for(let i=0;i<L;i++)s+=cs[rnd(cs.length)];list.push(s)}
    const bits=L*Math.log2(cs.length);$('#pgout').innerHTML=kv(list.map((p,i)=>['#'+(i+1),p]))+`<div class="note">Entropie : <b>${Math.round(bits)} bits</b> (${pwLevel(bits)[0].toLowerCase()}). Clique sur un mot de passe pour le copier.</div>`};
  const ph=()=>{const n=Math.min(20,Math.max(1,+$('#pgn').value||1)),list=[];for(let k=0;k<n;k++){const w=[];for(let i=0;i<5;i++)w.push(W[rnd(W.length)]);w[rnd(5)]+=rnd(100);list.push(w.join('-'))}
    $('#pgout').innerHTML=kv(list.map((p,i)=>['#'+(i+1),p]))+`<div class="note">5 mots tirés parmi ${W.length} + un nombre : facile à retenir et à taper. Pour plus de sécurité, utilise un gestionnaire de mots de passe (Bitwarden, KeePass).</div>`};
  $('#pggo').onclick=gen;$('#pgph').onclick=ph;gen();}});

tool({id:'force-mdp',cat:'cyber',name:'Force d\'un mot de passe',desc:'Évalue la robustesse d\'un mot de passe (entropie, faiblesses courantes) et propose des améliorations. Rien n\'est envoyé.',
html:`<div class="card"><div class="f"><label>Mot de passe à tester</label><input id="pwin" type="password" value="Azerty2026!" autocomplete="off"></div><label class="note" style="display:block"><input type="checkbox" id="pwshow" style="width:auto"> Afficher</label>
<div style="height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin-top:12px;overflow:hidden"><div id="pwbar" style="height:100%;width:0;transition:.25s"></div></div><div id="pwout" style="margin-top:14px"></div></div>`,
init(){const run=()=>{const p=$('#pwin').value;if(!p){$('#pwout').innerHTML='';$('#pwbar').style.width=0;return}
  const {bits,pool,weak}=pwEntropy(p),[lv,c,w]=pwLevel(bits);$('#pwbar').style.width=w+'%';$('#pwbar').style.background=c;
  const tips=[];if(p.length<12)tips.push('allonger à 12 caractères ou plus');if(!/[A-Z]/.test(p)||!/[a-z]/.test(p))tips.push('mélanger majuscules et minuscules');if(!/\d/.test(p))tips.push('ajouter des chiffres');if(!/[^a-zA-Z0-9]/.test(p))tips.push('ajouter des symboles');if(weak.length)tips.push('éviter les mots et motifs prévisibles');
  $('#pwout').innerHTML=kv([['Niveau',lv],['Entropie estimée',Math.round(bits)+' bits'],['Longueur',p.length+' caractères'],['Alphabet utilisé',pool+' symboles possibles'],['Faiblesses détectées',weak.join(', ')||'aucune évidente'],['Pour l\'améliorer',tips.join(' · ')||'rien à signaler']]);};
  $('#pwin').oninput=run;$('#pwshow').onchange=e=>$('#pwin').type=e.target.checked?'text':'password';run();}});

const CV={AV:{N:.85,A:.62,L:.55,P:.2},AC:{L:.77,H:.44},UI:{N:.85,R:.62},CIA:{H:.56,L:.22,N:0}};
const CVM=[['AV','Vecteur d\'attaque',[['N','Réseau'],['A','Adjacent'],['L','Local'],['P','Physique']]],['AC','Complexité',[['L','Faible'],['H','Élevée']]],['PR','Privilèges requis',[['N','Aucun'],['L','Faibles'],['H','Élevés']]],['UI','Interaction utilisateur',[['N','Aucune'],['R','Requise']]],['S','Portée',[['U','Inchangée'],['C','Modifiée']]],['C','Confidentialité',[['H','Haute'],['L','Basse'],['N','Aucune']]],['I','Intégrité',[['H','Haute'],['L','Basse'],['N','Aucune']]],['A','Disponibilité',[['H','Haute'],['L','Basse'],['N','Aucune']]]];
function cvssRound(x){const i=Math.round(x*100000);return i%10000===0?i/100000:(Math.floor(i/10000)+1)/10}
function cvss(v){const sc=v.S==='C';const PR={N:.85,L:sc?.68:.62,H:sc?.5:.27}[v.PR];
  const iss=1-(1-CV.CIA[v.C])*(1-CV.CIA[v.I])*(1-CV.CIA[v.A]);const imp=sc?7.52*(iss-.029)-3.25*Math.pow(iss-.02,15):6.42*iss;
  const ex=8.22*CV.AV[v.AV]*CV.AC[v.AC]*PR*CV.UI[v.UI];if(imp<=0)return {s:0,imp:0,ex};
  return {s:cvssRound(Math.min(sc?1.08*(imp+ex):imp+ex,10)),imp,ex}}
const cvSev=s=>s===0?['Aucune','var(--mut)']:s<4?['Faible','var(--acc2)']:s<7?['Moyenne','var(--warn)']:s<9?['Élevée','#f0883e']:['Critique','var(--err)'];
tool({id:'cvss',cat:'cyber',name:'Calculateur CVSS 3.1',desc:'Calcule le score de gravité d\'une vulnérabilité (0 à 10) et son vecteur, comme dans les bulletins CVE et CERT-FR.',
html:`<div class="card"><div class="grid2" id="cvf">${CVM.map(([k,l,o])=>`<div class="f"><label>${l} (${k})</label><select data-cv="${k}">${o.map(([v,t])=>`<option value="${v}">${t} (${v})</option>`).join('')}</select></div>`).join('')}</div>
<div class="f" style="margin-top:14px"><label>…ou colle un vecteur</label><input id="cvvec" placeholder="CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"></div><div id="cverr" class="err"></div></div>
<div class="card"><div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div id="cvscore" style="font:700 46px var(--mono)">0.0</div><div><div id="cvsev" style="font-weight:700;font-size:18px"></div><div class="note" style="margin:0">Gravité CVSS v3.1</div></div></div><div id="cvout" style="margin-top:14px"></div>
<div class="note">Échelle : 0,1–3,9 faible · 4–6,9 moyenne · 7–8,9 élevée · 9–10 critique. Le score de base ne tient pas compte de ton contexte : priorise aussi selon l'exposition réelle de tes systèmes.</div></div>`,
init(){const sel=$$('[data-cv]');const run=()=>{const v={};sel.forEach(s=>v[s.dataset.cv]=s.value);const r=cvss(v),[n,c]=cvSev(r.s);
  $('#cvscore').textContent=r.s.toFixed(1);$('#cvscore').style.color=c;$('#cvsev').textContent=n;$('#cvsev').style.color=c;
  const vec='CVSS:3.1/'+CVM.map(([k])=>k+':'+v[k]).join('/');$('#cvvec').value=vec;$('#cverr').textContent='';
  $('#cvout').innerHTML=kv([['Vecteur',vec],['Sous-score impact',fmtN(Math.max(0,r.imp),2)],['Sous-score exploitabilité',fmtN(r.ex,2)]]);};
  sel.forEach(s=>s.onchange=run);
  $('#cvvec').oninput=e=>{const m={};e.target.value.trim().replace(/^CVSS:3\.[01]\//i,'').split('/').forEach(p=>{const [k,x]=p.split(':');if(k)m[k.toUpperCase()]=(x||'').toUpperCase()});
    const ok=CVM.every(([k,,o])=>o.some(([v])=>v===m[k]));if(!ok){$('#cverr').textContent='Vecteur incomplet ou invalide.';return}
    sel.forEach(s=>s.value=m[s.dataset.cv]);const pos=e.target.selectionStart;run();e.target.setSelectionRange(pos,pos)};
  const d={AV:'N',AC:'L',PR:'N',UI:'N',S:'U',C:'H',I:'H',A:'H'};sel.forEach(s=>s.value=d[s.dataset.cv]);run();}});

const SECH=[['strict-transport-security','HSTS','Force le HTTPS pendant la durée indiquée (max-age ≥ 31536000 recommandé).'],['content-security-policy','CSP','Limite les sources de scripts, styles et images : principale protection contre le XSS.'],['x-content-type-options','X-Content-Type-Options','Doit valoir « nosniff » pour empêcher le navigateur de deviner le type des fichiers.'],['x-frame-options','X-Frame-Options','DENY ou SAMEORIGIN : protège contre le clickjacking (ou frame-ancestors dans la CSP).'],['referrer-policy','Referrer-Policy','Contrôle les informations envoyées aux autres sites (strict-origin-when-cross-origin conseillé).'],['permissions-policy','Permissions-Policy','Désactive les API sensibles inutiles (caméra, micro, géolocalisation).'],['cross-origin-opener-policy','COOP','Isole la fenêtre des autres origines (same-origin).']];
const LEAK=[['server','révèle le logiciel serveur et parfois sa version'],['x-powered-by','révèle la technologie utilisée (PHP, ASP.NET…)'],['x-aspnet-version','révèle la version d\'ASP.NET']];
tool({id:'entetes',cat:'cyber',name:'Audit des en-têtes HTTP',desc:'Colle les en-têtes de réponse de TON site pour vérifier les protections recommandées et les fuites d\'informations.',

Server: nginx/1.24.0
Content-Type: text/html; charset=UTF-8
X-Powered-By: PHP/8.2.10

  SECH.forEach(([k,n,d])=>{let st=h[k]!==undefined,txt=st?'✔ présent':'✘ absent',col=st?'var(--acc)':'var(--err)';
    if(k==='x-content-type-options'&&st&&h[k].toLowerCase()!=='nosniff'){txt='⚠ valeur incorrecte';col='var(--warn)';st=false}
    if(k==='strict-transport-security'&&st){const m=+(h[k].match(/max-age=(\d+)/i)||[])[1];if(!(m>=15552000)){txt='⚠ max-age trop court';col='var(--warn)';st=false}}
    if(k==='x-frame-options'&&!st&&/frame-ancestors/i.test(h['content-security-policy']||'')){txt='✔ via CSP';col='var(--acc)';st=true}
    if(st)ok++;rows+=`<tr><td>${n}</td><td style="color:${col}">${txt}</td><td style="font-family:Inter">${d}</td></tr>`});

  $('#hhout').innerHTML=`<div style="display:flex;gap:16px;align-items:center;margin-bottom:12px"><div style="font:700 40px var(--mono);color:${pct>=70?'var(--acc)':pct>=50?'var(--warn)':'var(--err)'}">${g}</div><div>${ok}/${SECH.length} protections en place</div></div><div class="tbl"><table>${rows}</table></div>`;};
  $('#hhin').oninput=run;run();}});

tool({id:'hmac',cat:'cyber',name:'HMAC & signatures',desc:'Calcule un HMAC (SHA-256/384/512) pour vérifier un webhook, une signature d\'API ou l\'intégrité d\'un message.',
html:`<div class="card"><div class="f"><label>Message</label><textarea id="hmmsg" style="min-height:90px">{"event":"payment.succeeded","id":42}</textarea></div>
<div class="row" style="margin-top:10px"><div class="f"><label>Clé secrète</label><input id="hmkey" value="ma-cle-secrete"></div><div class="f"><label>Algorithme</label><select id="hmalg"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option><option>SHA-1</option></select></div></div>
<div class="f" style="margin-top:10px"><label>Signature reçue à comparer (facultatif)</label><input id="hmexp"></div><div id="hmout" style="margin-top:14px"></div></div>`,
init(){const run=async()=>{if(!crypto.subtle)return;const k=await crypto.subtle.importKey('raw',utf8($('#hmkey').value||'\0'),{name:'HMAC',hash:$('#hmalg').value},false,['sign']);
  const sig=new Uint8Array(await crypto.subtle.sign('HMAC',k,utf8($('#hmmsg').value)));const hx=[...sig].map(x=>x.toString(16).padStart(2,'0')).join(''),b=b64e(sig);
  const e=$('#hmexp').value.trim().replace(/^sha\d+=/i,'');let m='';if(e)m=(e.toLowerCase()===hx||e===b)?'<div class="note" style="color:var(--acc)">✔ Signature valide</div>':'<div class="note" style="color:var(--err)">✘ Signature différente</div>';
  $('#hmout').innerHTML=kv([['HMAC (hex)',hx],['HMAC (Base64)',b]])+m;};
  ['#hmmsg','#hmkey','#hmalg','#hmexp'].forEach(s=>$(s).addEventListener('input',run));run();}});

tool({id:'uuid',cat:'cyber',name:'UUID & jetons aléatoires',desc:'Génère des UUID v4, des jetons hexadécimaux ou Base64 (clés d\'API, secrets de session, sels).',
html:`<div class="card"><div class="row"><div class="f"><label>Type</label><select id="uuty"><option value="uuid">UUID v4</option><option value="hex">Jeton hexadécimal</option><option value="b64">Jeton Base64URL</option></select></div><div class="f"><label>Taille (octets, pour les jetons)</label><input id="uusz" type="number" min="8" max="128" value="32"></div><div class="f"><label>Nombre</label><input id="uun" type="number" min="1" max="20" value="5"></div><div><button class="pri" id="uugo">Générer</button></div></div><div id="uuout" style="margin-top:14px"></div>
<div class="note">32 octets (256 bits) suffisent pour une clé d'API ou un secret JWT. Ne réutilise jamais un secret entre deux environnements.</div></div>`,

  for(let i=0;i<n;i++){if(t==='uuid')l.push(crypto.randomUUID?crypto.randomUUID():'');else{const b=crypto.getRandomValues(new Uint8Array(sz));l.push(t==='hex'?[...b].map(x=>x.toString(16).padStart(2,'0')).join(''):b64e(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''))}}

const sha256=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',utf8(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
document.body.insertAdjacentHTML('beforeend',`<div id="jdmModal" class="modal" hidden><div class="mbox"><div class="mhead"><b>Accès administrateur</b><button id="jdmClose" aria-label="Fermer">✕</button></div>
<p class="note" style="margin:0 0 12px">Saisis le code d'accès.</p><input id="jdmCode" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••••">
<div id="jdmErr" class="err"></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="pri" id="jdmOk">Valider</button></div></div></div>`);
document.body.insertAdjacentHTML('beforeend',`<div id="lockScreen"><div class="lbox"><div class="logo" style="margin:0 auto 18px;width:52px;height:52px;font-size:18px">&gt;_</div><h1>${esc(NAME)}</h1><div class="lpill">● Accès temporairement fermé</div><p id="lockMsgTxt"></p></div><span class="jdm lfoot">© 2026 JDM</span></div>`);
function applyLock(){const on=cfg.locked&&!isAdmin();document.body.classList.toggle('locked',on);$('#lockMsgTxt').textContent=cfg.lockMsg||CFG0.lockMsg;if(on)document.title=NAME+' — Indisponible'}
let jdmClicks=0,jdmT=null,jdmFails=0,jdmLock=0;
const openJdm=()=>{$('#jdmModal').hidden=false;$('#jdmErr').textContent='';$('#jdmCode').value='';setTimeout(()=>$('#jdmCode').focus(),30)};
const closeJdm=()=>{$('#jdmModal').hidden=true};
document.addEventListener('click',e=>{if(!e.target.closest('.jdm'))return;jdmClicks++;clearTimeout(jdmT);jdmT=setTimeout(()=>jdmClicks=0,4000);
  if(jdmClicks>=10){jdmClicks=0;if(isAdmin()){location.hash='admin';return}openJdm()}});
$('#jdmClose').onclick=closeJdm;$('#jdmModal').addEventListener('click',e=>{if(e.target.id==='jdmModal')closeJdm()});
const tryCode=async()=>{if(Date.now()<jdmLock){$('#jdmErr').textContent=`Trop d'essais. Réessaie dans ${Math.ceil((jdmLock-Date.now())/1000)} s.`;return}
  const code=$('#jdmCode').value.trim();let ok=false,tok=null,msg='Code incorrect.';
  if(SERVER){try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});const j=await r.json().catch(()=>({}));
      if(r.ok&&j.token){ok=true;tok={token:j.token,exp:j.exp}}else msg=j.error||msg}catch{msg='Serveur injoignable.'}}
  else if(ADMIN_HASH)ok=(await sha256(code))===ADMIN_HASH;
  else msg='Administration disponible uniquement sur le site en ligne.';
  if(ok){jdmFails=0;setAdmin(true,tok);closeJdm();applyLock();toast('Mode administrateur activé');drawNav($('#search').value);location.hash='admin';route()}
  else{if(!SERVER){jdmFails++;if(jdmFails>=5){jdmLock=Date.now()+60000;jdmFails=0}}$('#jdmErr').textContent=msg;const b=$('.mbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#jdmCode').select()}};
$('#jdmOk').onclick=tryCode;$('#jdmCode').addEventListener('keydown',e=>{if(e.key==='Enter')tryCode();else if(e.key==='Escape')closeJdm()});

function renderAdmin(){const st=store.get('stats',{}),tot=Object.values(st).reduce((a,b)=>a+b,0);
  const rows=ALL.map(t=>({t,n:st[t.id]||0})).sort((a,b)=>b.n-a.n);
  $('#t-admin').innerHTML=`<div class="thead"><div><div class="crumb"><a href="#accueil">Accueil</a><span>/</span><span style="color:var(--warn)">Administration</span></div><h1>Espace administrateur</h1><p class="desc">${SERVER?'Réglages partagés : ils s\'appliquent immédiatement à <b>tous les visiteurs</b>.':'Mode local : les réglages ne s\'appliquent qu\'à ce navigateur. Une fois le site hébergé sur Cloudflare, ils s\'appliqueront à tous.'}</p></div><button id="admOut">Se déconnecter</button></div>
  <div class="card lockcard"><h2>Accès au site</h2><div id="admLockState" class="lstate"></div>
  <div class="f" style="margin-top:14px"><label>Message affiché aux visiteurs quand le site est bloqué</label><textarea id="admLockMsg" style="min-height:70px;font-family:Inter,sans-serif">${esc(cfg.lockMsg)}</textarea></div>
  <div class="row" style="margin-top:12px"><button id="admLockBtn"></button><button id="admPreview">Aperçu de la page de blocage</button></div>
  <div class="note">Toi, tu gardes l'accès : 10 clics sur « © 2026 JDM » en bas de la page, puis ton code.</div></div>
  <div class="grid2">
  <div class="card"><h2>Identité du site</h2><div class="f"><label>Nom du site</label><input id="admTitle" value="${esc(cfg.title)}"></div><div class="f" style="margin-top:10px"><label>Sous-titre</label><input id="admSub" value="${esc(cfg.subtitle)}"></div></div>
  <div class="card"><h2>Bannière d'annonce</h2><div class="f"><label>Message (vide = pas de bannière)</label><input id="admBan" value="${esc(cfg.banner)}" placeholder="ex. Nouvel outil : calculateur VLSM"></div><div class="f" style="margin-top:10px"><label>Style</label><select id="admBanT">${[['info','Information'],['ok','Nouveauté'],['warn','Avertissement']].map(([v,l])=>`<option value="${v}" ${cfg.bannerType===v?'selected':''}>${l}</option>`).join('')}</select></div></div></div>
  <div class="card"><h2>Outils affichés</h2><div class="admtools">${Object.entries(CATS).map(([k,[n,c]])=>`<div><div class="cat" style="margin:0 0 8px"><i style="background:${c}"></i>${n}</div>${ALL.filter(t=>t.cat===k).map(t=>`<label class="chk"><input type="checkbox" data-vis="${t.id}" ${cfg.hidden.includes(t.id)?'':'checked'}> ${t.name}</label>`).join('')}</div>`).join('')}</div>
  <div class="row" style="margin-top:16px"><button class="pri" id="admSave">Enregistrer et appliquer</button><span class="note" style="margin:0">La page se recharge pour appliquer les changements.</span></div></div>
  <div class="grid2">
  <div class="card"><h2>Statistiques d'utilisation (ce navigateur)</h2><div class="kv" style="margin-bottom:10px"><span>Ouvertures d'outils</span><code class="v">${tot}</code><span>Outils masqués</span><code class="v">${cfg.hidden.length}</code><span>Favoris</span><code class="v">${favs.length}</code></div>
    <div class="tbl" style="max-height:260px"><table><tr><th>Outil</th><th>Ouvertures</th></tr>${rows.map(r=>`<tr><td style="font-family:Inter">${r.t.name}</td><td>${r.n}</td></tr>`).join('')}</table></div>
    <div class="row" style="margin-top:12px"><button id="admStatR">Remettre à zéro</button></div></div>
  <div class="card"><h2>Configuration</h2><div class="f"><label>Export / import (JSON)</label><textarea id="admJson" style="min-height:150px">${esc(JSON.stringify(cfg,null,2))}</textarea></div>
    <div class="row" style="margin-top:12px"><button id="admCopy">Copier</button><button id="admImp">Importer ce JSON</button><button id="admReset" style="color:var(--err)">Tout réinitialiser</button></div></div></div>`;
  $('#admOut').onclick=()=>{setAdmin(false);toast('Déconnecté');location.hash='accueil';drawNav();applyLock()};
  const lockUI=()=>{const b=$('#admLockBtn'),p=$('#admLockState');p.className='lstate '+(cfg.locked?'off':'on');p.textContent=cfg.locked?'● Site bloqué : les visiteurs voient la page de maintenance':'● Site ouvert : accessible à tous';b.textContent=cfg.locked?'Débloquer l\'accès':'Bloquer l\'accès';b.className=cfg.locked?'pri':'danger'};
  $('#admLockBtn').onclick=async()=>{const nl=!cfg.locked,nm=$('#admLockMsg').value.trim()||CFG0.lockMsg;$('#admLockBtn').disabled=true;const ok=await persist({...cfg,locked:nl,lockMsg:nm});$('#admLockBtn').disabled=false;if(!ok)return;cfg.locked=nl;cfg.lockMsg=nm;lockUI();$('#admJson').value=JSON.stringify(cfg,null,2);toast(cfg.locked?'Accès au site bloqué':'Accès au site débloqué')};
  $('#admLockMsg').addEventListener('change',async()=>{const nm=$('#admLockMsg').value.trim()||CFG0.lockMsg;if(!await persist({...cfg,lockMsg:nm}))return;cfg.lockMsg=nm;$('#admJson').value=JSON.stringify(cfg,null,2);toast('Message enregistré')});
  $('#admPreview').onclick=()=>{document.body.classList.add('locked','preview');$('#lockMsgTxt').textContent=$('#admLockMsg').value.trim()||CFG0.lockMsg};
  lockUI();
  const save=async c=>{if(!await persist(c))return;toast('Enregistré');location.hash='admin';setTimeout(()=>location.reload(),400)};
  $('#admSave').onclick=()=>save({...cfg,title:$('#admTitle').value.trim()||'NetConvert',subtitle:$('#admSub').value.trim(),banner:$('#admBan').value.trim(),bannerType:$('#admBanT').value,hidden:$$('[data-vis]').filter(x=>!x.checked).map(x=>x.dataset.vis)});
  $('#admStatR').onclick=()=>{store.set('stats',{});renderAdmin();toast('Statistiques remises à zéro')};
  $('#admCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#admJson').value);toast('Configuration copiée')}catch{$('#admJson').select();toast('Sélectionnée, fais Ctrl+C')}};
  $('#admImp').onclick=()=>{try{const c=JSON.parse($('#admJson').value);if(typeof c!=='object'||!c)throw 0;save({...CFG0,...c,hidden:Array.isArray(c.hidden)?c.hidden:[]})}catch{toast('JSON invalide')}};
  $('#admReset').onclick=()=>{if($('#admReset').dataset.c!=='1'){$('#admReset').dataset.c='1';$('#admReset').textContent='Confirmer la réinitialisation';return}store.set('stats',{});store.set('favs',[]);save({})};}

$('#lockScreen').addEventListener('click',e=>{if(document.body.classList.contains('preview')&&!e.target.closest('.jdm')){document.body.classList.remove('locked','preview')}});
window.addEventListener('hashchange',route);drawNav();favBtns();route();applyLock();
document.body.classList.remove('booting');
})().catch(e=>{console.error(e);document.body.classList.remove('booting')});
</script>
</body>
</html>
